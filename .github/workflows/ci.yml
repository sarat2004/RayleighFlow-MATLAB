name: RayleighFlow CI

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]

concurrency:
  group: rayleighflow-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Lint, Smoke Test & Unit Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: R2024b   # pin to the release you build/test with

      - name: Static code check (checkcode)
        uses: matlab-actions/run-command@v2
        with:
          command: |
            addpath(genpath('src'));
            addpath('app');
            files = [ ...
              dir(fullfile('src', 'equations', '*.m')); ...
              dir(fullfile('app', 'RayleighFlowApp.mlapp')) ...
            ];
            hasIssues = false;
            for k = 1:numel(files)
              f = fullfile(files(k).folder, files(k).name);
              results = checkcode(f, '-struct');
              if ~isempty(results)
                fprintf('--- %s ---\n', f);
                disp(struct2table(results));
                hasIssues = true;
              end
            end
            if hasIssues
              warning('checkcode found issues (see above).');
            end

      - name: Unit test equation functions
        uses: matlab-actions/run-tests@v2
        with:
          source-folder: src/equations
          select-by-folder: tests
          test-results-junit: test-results/results.xml
          code-coverage-cobertura: code-coverage/coverage.xml

      - name: Start virtual framebuffer (Xvfb)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb
          Xvfb :99 -screen 0 1280x1024x24 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Headless smoke test (launch & close app)
        uses: matlab-actions/run-command@v2
        with:
          command: |
            addpath(genpath('src'));
            addpath('app');
            try
              app = RayleighFlowApp();
              pause(2);
              delete(app);
              disp('App launched and closed successfully.');
            catch ME
              disp(getReport(ME));
              error('Smoke test failed: %s', ME.message);
            end
        # DISPLAY is set by the "Start virtual framebuffer" step above, so
        # App Designer's UIFigure has a display to render into on the runner.

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results/
            code-coverage/